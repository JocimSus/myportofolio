<form id="experience-form"
      method="post"
      action="{% if mode == 'update' %}{% url 'api:experience-detail' experience.pk %}{% else %}{% url 'api:experience-list' %}{% endif %}"
      {% if mode == 'update' %}hx-patch="{% url 'api:experience-detail' experience.pk %}"{% else %}hx-post="{% url 'api:experience-list' %}"{% endif %}
      hx-swap="none"
      hx-headers='{"X-CSRFToken": "{{ csrf_token }}", "Accept": "application/json"}'
      class="flex flex-col">
  {% csrf_token %}
  {% for field in form %}
    <div class="w-full flex flex-col gap-2 mb-5 text-left form-w-full">
      <label for="{{ field.id_for_label }}"
             class="text-sm font-medium text-primary-100">
        {{ field.label }}
      </label>
      <div class="w-full rounded-lg text-primary-800 border border-primary-100 bg-neutral-200 text-sm transition focus-within:border-primary-500 focus-within:ring-2 focus-within:ring-primary-800">
        {{ field }}
      </div>
      {% if field.help_text %}<p class="text-xs text-neutral-500 mt-0.5">{{ field.help_text }}</p>{% endif %}
      {% for error in field.errors %}<p class="text-red-400 text-sm">{{ error }}</p>{% endfor %}
      <p id="error-{{ field.name }}"
         class="field-error hidden text-red-400 text-sm"></p>
    </div>
  {% endfor %}
  <div class="flex items-center justify-end gap-3 pt-4 mt-2 border-t border-neutral-300">
    <button type="button"
            popovertarget="add-experience-modal"
            popovertargetaction="hide"
            class="bg-black py-2.5 px-4 rounded-lg text-neutral-100 font-bold text-sm hover:opacity-90 transition cursor-pointer">
      Batal
    </button>
    <button type="submit"
            class="bg-secondary-100 py-2.5 px-4 rounded-lg text-neutral-100 font-bold text-sm hover:opacity-90 transition cursor-pointer">{% if mode == 'update' %}Simpan Perubahan{% else %}Tambah Experience{% endif %}</button>
  </div>
</form>
