{% load static %}

<div id="toast-component"
     class="toast-hidden inset-auto right-4 bottom-4 z-50 fixed flex items-center gap-4 p-4 min-w-72 max-w-sm bg-neutral-200 border border-neutral-300 shadow-2xl rounded-lg transition-all duration-300 ease-in-out pointer-events-none"
     popover="manual">
  <div class="toast-content flex flex-col gap-0.5">
    <h3 id="toast-title"
        class="toast-title text-base font-bold text-secondary-100">
      This is a Sample Title
    </h3>
    <p id="toast-message" class="toast-message text-xs text-tertiary-600">This is a Sample Message</p>
  </div>
</div>
<script src="{% static 'home/js/toast.js' %}"></script>
