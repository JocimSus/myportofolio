<dialog id="add-project-modal"
        popover="auto"
        aria-modal="true"
        aria-labelledby="add-project-title"
        class="m-auto p-0 bg-transparent shadow-2xl backdrop:bg-black/50 backdrop:backdrop-blur-sm max-w-lg w-[calc(100%-2rem)]">
  <div class="relative bg-neutral-100 rounded-xl p-6 text-neutral-100 shadow-2xl">
    <button type="button"
            popovertarget="add-project-modal"
            popovertargetaction="hide"
            aria-label="Close project modal"
            class="absolute top-4 right-4 flex items-center justify-center w-8 h-8 rounded-lg text-neutral-400 hover:bg-primary-100 hover:text-neutral-100 text-xl font-bold transition-colors cursor-pointer">
      <i class="fa-solid fa-xmark"></i>
    </button>
    <div class="flex items-center gap-3 mb-6 text-primary-100">
      <i class="fa-solid {% if slug %}fa-pen-to-square{% else %}fa-file{% endif %} text-lg"></i>
      <h2 id="add-project-title" class="text-xl font-bold">
        {% if slug %}Update Project{% else %}Add New Project{% endif %}
      </h2>
    </div>
    <form id="project-form"
          method="post"
          action="{% if slug %}{% url 'home:update_project_ajax' slug %}{% else %}{% url 'home:create_project_ajax' %}{% endif %}"
          {% if htmx_enabled %}hx-post="{% url 'home:create_project_ajax' %}" hx-target="#grid" hx-swap="innerHTML" hx-on::after-request="if (event.detail.successful) { this.reset(); document.getElementById('add-project-modal').hidePopover(); }"{% endif %}
          class="flex flex-col">
      {% csrf_token %}
      <div id="project-form-fields">{% include "home/partials/project_form_fields.html" %}</div>
      <div class="flex items-center justify-end gap-3 pt-4 mt-2 border-t border-neutral-300">
        <button type="button"
                popovertarget="add-project-modal"
                popovertargetaction="hide"
                class="bg-black py-2.5 px-4 rounded-lg text-neutral-100 font-bold text-sm hover:opacity-90 transition cursor-pointer">
          Batal
        </button>
        <button type="submit"
                class="bg-secondary-100 py-2.5 px-4 rounded-lg text-neutral-100 font-bold text-sm hover:opacity-90 transition cursor-pointer">
          {% if slug %}Simpan Perubahan{% else %}Tambah Project{% endif %}
        </button>
      </div>
    </form>
  </div>
</dialog>
