<dialog id="add-experience-modal"
        popover="auto"
        aria-modal="true"
        aria-labelledby="add-experience-title"
        class="m-auto p-0 bg-transparent shadow-2xl backdrop:bg-black/50 backdrop:backdrop-blur-sm max-w-lg w-[calc(100%-2rem)]">
  <div class="relative bg-neutral-100 rounded-xl p-6 text-neutral-100 shadow-2xl">
    <button type="button"
            popovertarget="add-experience-modal"
            popovertargetaction="hide"
            aria-label="Close experience modal"
            class="absolute top-4 right-4 flex items-center justify-center w-8 h-8 rounded-lg text-neutral-400 hover:bg-primary-100 hover:text-neutral-100 text-xl font-bold transition-colors cursor-pointer">
      <i class="fa-solid fa-xmark"></i>
    </button>
    <div class="flex items-center gap-3 mb-6 text-primary-100">
      <i class="fa-solid fa-file text-lg"></i>
      <h2 id="add-experience-title" class="text-xl font-bold">Experience</h2>
    </div>
    <div id="experience-form-container">{% include "home/partials/experience_form.html" with mode="create" %}</div>
  </div>
</dialog>
