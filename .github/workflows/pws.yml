name: Push to PWS

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Git
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'

    - name: Push to PWS
      env:
        PWS_URL: ${{ secrets.PWS_URL }}
      run: |
        if [[ -z "$PWS_URL" ]]; then
          echo "Error: PWS_URL secret is missing or empty."
          exit 1
        fi

        current_branch="${GITHUB_REF_NAME:-$(git branch --show-current)}"
        echo "Current branch: $current_branch"

        if ! push_output=$(git push "$PWS_URL" "$current_branch:main" 2>&1); then
          echo "Push failed with output: $push_output"
          echo "Error: Unable to push changes. Please check the error message and resolve any conflicts manually."
          exit 1
        fi

        echo "Push successful with output: $push_output"